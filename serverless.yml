resources:
  Resources:
    VRCVSTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.table}
        AttributeDefinitions:
          - AttributeName: attribute_name
            AttributeType: S
          - AttributeName: attribute_key
            AttributeType: S
        KeySchema:
          - AttributeName: attribute_name
            KeyType: HASH
          - AttributeName: attribute_key
            KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        TimeToLiveSpecification:
          AttributeName: TTL
          Enabled: True
