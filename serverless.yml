service: vrc-vs-server

frameworkVersion: "3"

plugins:
  - serverless-python-requirements

custom:
  table: ${self:service}-${opt:stage}-table
  pythonRequirements:
    dockerizePip: true
    dockerImage: public.ecr.aws/sam/build-python3.10:latest
    useStaticCache: false
    useDownloadCache: false
    layer: true
  deploymentBucket:
    name: net.akakitune87.serverlessdeoloy

provider:
  name: aws
  runtime: python3.10
  region: ap-northeast-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:*
      Resource: "arn:aws:dynamodb:ap-northeast-1:*:*"
    - Effect: Allow
      Action:
        - s3:*
      Resource: "arn:aws:s3:::*"
  timeout: 7
  logRetentionInDays: 14
  tracing:
    apiGateway: true
    lambda: true

package:
  individually: true
  exclude:
    - node_modules/**
    - .gitignore
    - package-lock.json
    - requirements.txt
    - serverless.yml
    - .env
    - memo.txt
    - example.py
    - src/**
    - LICENSE

layers:
  utilsLayer:
    path: src/layers/utils
    name: ${opt:stage}-${self:service}-utilsLayer
    description: utils
    compatibleRuntimes:
      - python3.8

functions:
  rv_entry_regist:
    handler: src/lambda/rv_entry_regist/handler.main
    package:
      include:
        - src/lambda/rv_entry_regist/handler.py
    environment:
      TABLE: ${self:custom.table}
      NOTIC_URL: ${env:NOTIC_URL}
      OTHELLO_URL: ${env:OTHELLO_URL}
    layers:
      - { Ref: UtilsLayerLambdaLayer }
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - http:
          path: /rv/entry/regist
          method: get
  rv_matching_check:
    handler: src/lambda/rv_matching_check/handler.main
    package:
      include:
        - src/lambda/rv_matching_check/handler.py
    environment:
